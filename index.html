<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Banner - Anthea Mathekga</title>
  <style>
    @import url('https://googleapis.com');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Standard LinkedIn Banner Ratio (1584px x 396px) */
    .banner-container {
      width: 1584px;
      height: 396px;
      background-color: #050608;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 100px; /* Extra breathing room on sides */
      border: 1px solid #11141a;
      
      /* Extremely subtle tech-grid lines */
      background-image: 
        linear-gradient(rgba(6, 182, 212, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.02) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    /* Ambient background soft cyan glow */
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      left: -200px;
      top: -200px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Left Text Area */
    .profile-info {
      max-width: 800px;
      z-index: 2;
    }

    .tag-container {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #06b6d4;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .name-heading {
      font-size: 68px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 14px;
    }

    .name-heading span {
      color: #06b6d4;
    }

    .profile-summary {
      font-size: 18px;
      color: #64748b;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    /* Right Picture Area */
    .right-showcase {
      z-index: 2;
    }

    .image-frame {
      width: 220px;
      height: 260px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
      background-color: #0f172a;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <div class="ambient-glow"></div>
    
    <!-- Minimalist Left Section -->
    <div class="profile-info">
      <div class="tag-container">&gt; Systems Support & App Development</div>
      <h1 class="name-heading">Anthea Mathekga<span>.</span></h1>
      <p class="profile-summary">Bridging systems infrastructure and application delivery.</p>
    </div>

    <!-- Minimalist Right Section -->
    <div class="right-showcase">
      <div class="image-frame">
        <img src="pictureyam.jpg.jpg" alt="Anthea Mathekga">
      </div>
    </div>
  </div>

</body>
</html>
